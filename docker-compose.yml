services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: share
      POSTGRES_USER: share
      POSTGRES_PASSWORD: share
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U share -d share"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/share
      DATABASE_USERNAME: share
      DATABASE_PASSWORD: share
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STORAGE_LOCATION: /data/uploads
      CORS_ORIGINS: http://localhost:5173
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-dev-only-access-token-secret-change-me}
      MAX_FILE_SIZE: "52428800"
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
