spring:
  application:
    name: all-share
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/share}
    username: ${DATABASE_USERNAME:share}
    password: ${DATABASE_PASSWORD:share}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/temporary_share_logs}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  # Trust X-Forwarded-For only from loopback/private proxies such as the Vite dev server.
  forward-headers-strategy: native
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    whitelabel:
      enabled: false
  tomcat:
    max-swallow-size: 55MB
    max-http-form-post-size: 55MB

app:
  storage:
    location: ${STORAGE_LOCATION:./data/uploads}
  share:
    max-file-size: 52428800
    max-text-length: 1000000
    access-token-ttl: 15m
    cleanup-delay-ms: 60000
    allowed-expirations: 15,60,360,1440,4320,10080
  security:
    access-token-secret: ${ACCESS_TOKEN_SECRET:dev-only-access-token-secret-change-me}
  rate-limit:
    create-per-minute: ${RATE_LIMIT_CREATE_PER_MINUTE:20}
    verify-per-minute: ${RATE_LIMIT_VERIFY_PER_MINUTE:10}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  request-log:
    enabled: ${REQUEST_LOG_ENABLED:true}
